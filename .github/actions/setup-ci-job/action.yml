name: Setup CI job (pypto-serving)
description: >-
  Shared setup for every self-hosted pypto-serving job (ci.yml `unit-tests`).
  It runs directly on the host, as the same user: resilient checkout into a
  per-job dir, toolchain resolution from a cached pypto source, ptoas + pto-isa
  install, a per-job venv + activate.sh, a from-source build/install of pypto +
  simpler, and the serving repo's own editable install.

  Like pypto-lib — and unlike pypto, which builds itself — pypto-serving builds
  against a separate pypto clone kept in a per-job
  ci-cache/pypto-src-<build-namespace>-<runner> dir (concurrent jobs must not
  share one build tree; see build-namespace). The toolchain pins (ptoas
  version/sha, pto-isa commit) are read from that same clone, so the installed
  pypto and the pins always match. pypto-lib itself is not built: it is a git
  submodule of this repo and its kernels are consumed as source, resolved
  relative to the checkout root.

  Each host describes its own layout in the runner's `.env` (the file in the
  runner application's root dir, which the runner service loads into every job it
  runs). That is where the absolute paths live — not in git — so no workflow names
  one and a differently-laid-out host needs no repo change. The runner must set:

    CONDA_ROOT             conda install to layer the per-job venv on
                           (toolchain: conda)
    CI_CACHE_ROOT          dir CI may keep its caches in (created if absent)
    CANN_ROOT              CANN toolkit — device runners only (needs-device)
    PYPTO_QWEN3_MODEL_DIR  model weights — read by the test steps in ci.yml
    PYPTO_DSV4_MODEL_DIR
    PYPTO_DSV4_DSPARK_MODEL_DIR

  and may set, when its layout differs from the fleet default:

    TOOLCHAIN_BUNDLE_ROOT  dir to source the bundle's activate.sh from
                           (toolchain: bundle); defaults to
                           /opt/pypto/toolchain/current. Not named
                           PYPTO_TOOLCHAIN_ROOT — `pypto-toolchain` reads that
                           name itself, as its install root.

  Beyond those, the host is expected to provide (by name, not by path): a conda
  env `py310-serving` under CONDA_ROOT when toolchain is 'conda', the
  `pypto-toolchain` command when it is 'bundle' (this action calls it before the
  bundle is sourced, so it has to be on PATH already), and task-submit / npu-smi
  / ccache / git / curl on PATH. The `.env` makes the *locations* portable; these
  names are the provisioning contract a runner has to satisfy to be usable at
  all.

  The CPU architecture is detected, not pinned: ptoas is fetched as the CPython
  3.10 manylinux wheel for $(uname -m) and checked against the matching
  PTOAS_SHA256_<ARCH> in pypto's toolchain/versions.env, which is also where the
  ptoas *version* is managed. So a new arch needs no change here — only an entry
  upstream. Since v0.55 the release no longer ships a per-arch ptoas-bin tarball
  and its standalone archive requires CPython 3.11, so the wheel is installed
  into an isolated venv at PTOAS_ROOT, which keeps the PTOAS_ROOT/bin/ptoas
  layout pypto's discovery already accepts.

  The calling job must define the PTOAS_ROOT, PTO_ISA_ROOT, CMAKE_* and the
  non-path CCACHE_* (MAXSIZE / UMASK) environment variables; they are read from
  the job environment here. PTOAS_VERSION, PTOAS_SHA256, PTO_ISA_COMMIT and
  CCACHE_NAMESPACE are resolved and exported by this action, as is every cache
  path (CCACHE_DIR, PIP_CACHE_DIR, PTOAS_CACHE_DIR, PYPTO_SRC) — they derive from
  CI_CACHE_ROOT and so cannot live in the caller's static job-level `env:` block.

inputs:
  checkout-path:
    description: >-
      Workspace-relative dir to check the repo out into (also the venv /
      activate.sh home). Isolates each job's tree on the shared self-hosted host.
    required: true
  ccache-name:
    description: >-
      ccache dir under CI_CACHE_ROOT. The default shares one cache with the other
      repos on this host, which is the point of a compile cache: pypto-serving
      builds the same pypto source they do.
    required: false
    default: ccache
  pip-cache-name:
    description: >-
      pip cache dir under CI_CACHE_ROOT. Unlike ccache, pip has no shared-umask
      knob, so concurrent jobs each take their own dir rather than fight over
      file ownership.
    required: true
  build-namespace:
    description: >-
      Per-job-type discriminator for the pypto build tree, which is stored at
      ci-cache/pypto-src-<namespace>-<runner name>. Two jobs must never share one
      tree: whoever syncs second runs `reset --hard` / `clean -ffdx` /
      `rm -rf build` under the other's in-flight libbacktrace configure, which
      surfaces as intermittent "C compiler cannot create executables" failures.

      The runner name in the path covers concurrency (an instance runs one job at
      a time, so each tree has a single writer); this input covers the rest.
    required: true
  needs-device:
    description: >-
      When 'true' the job talks to an NPU: verify a card is visible (npu-smi) and
      have activate.sh source CANN's set_env.sh, which wires up the Ascend/HCCL
      host environment. When 'false' both are skipped and CANN_ROOT is not
      required in the runner config.
    required: false
    default: 'false'
  toolchain:
    description: >-
      Where Python and GCC come from. 'conda' is the historical path: a
      per-machine conda env under CONDA_ROOT with a --system-site-packages venv
      layered on it. 'bundle' uses the pinned pypto-toolchain bundle the runner
      declares in TOOLCHAIN_BUNDLE_ROOT, which is byte-identical on every host
      and carries its own ccache and uv.

      Default stays 'conda' so an unprovisioned runner keeps working; jobs move
      one at a time and each reverts on its own line.
    required: false
    default: 'conda'

runs:
  using: composite
  steps:
    - name: Check runner config and derive cache paths
      # The runner describes its own host layout in <runner-root>/.env, which the
      # runner service loads into every job it runs — so these arrive as plain env
      # vars and nothing here has to know an absolute path. First step on purpose:
      # a runner missing its .env must fail here with an actionable message, not
      # 40 minutes later as an opaque "conda: command not found" mid-build.
      shell: bash
      env:
        NEEDS_DEVICE: ${{ inputs.needs-device }}
        CCACHE_NAME: ${{ inputs.ccache-name }}
        PIP_CACHE_NAME: ${{ inputs.pip-cache-name }}
        BUILD_NAMESPACE: ${{ inputs.build-namespace }}
        TOOLCHAIN_IN: ${{ inputs.toolchain }}
      run: |
        set -uo pipefail
        # Prerequisites CI does not create, so they must already be there. Model
        # dirs are checked by the test steps that read them, not here.
        required=""
        if [ "${TOOLCHAIN_IN:-conda}" = "conda" ]; then
          required="CONDA_ROOT"
        fi
        if [ "$NEEDS_DEVICE" = "true" ]; then
          required="$required CANN_ROOT"
        fi
        bad=0
        for key in $required CI_CACHE_ROOT; do
          if [ -z "${!key:-}" ]; then
            echo "::error::$key is not set — add it to this runner's .env"
            bad=1
          fi
        done
        if [ "$bad" -ne 0 ]; then
          # The runner's .env takes the whole rest of the line as the value: it
          # supports neither inline comments nor quoting. Keep these samples bare
          # so they can be pasted verbatim without smuggling in a trailing "#...".
          echo "The runner declares its host layout in <runner-root>/.env."
          echo "One KEY=VALUE per line, no quotes and no trailing comments:"
          echo "  CONDA_ROOT=/path/to/miniconda3"
          echo "  CI_CACHE_ROOT=/path/to/ci-cache"
          echo "  PYPTO_QWEN3_MODEL_DIR=/path/to/Qwen3-14B"
          echo "  PYPTO_DSV4_MODEL_DIR=/path/to/dsv4-flash-w8a8"
          echo "  PYPTO_DSV4_DSPARK_MODEL_DIR=/path/to/dsv4-flash-dspark-w8a8"
          echo "  CANN_ROOT=/usr/local/Ascend/cann-9.0.0"
          echo "(CANN_ROOT is only needed on device runners; CI_CACHE_ROOT is"
          echo " created if absent. The service reads .env at startup — restart"
          echo " it after editing.)"
          exit 1
        fi
        for key in $required; do
          if [ ! -d "${!key}" ]; then
            echo "::error::$key points at a missing directory: ${!key}"
            # A value carrying a trailing "#..." is the classic .env mistake:
            # the runner does not strip inline comments, so the comment lands in
            # the path. Say so outright instead of leaving a puzzling directory.
            case "${!key}" in
              *"#"*) echo "The value contains a '#'. The runner's .env has no"
                     echo "inline comments — the rest of the line is part of the"
                     echo "value. Put $key on a line of its own, bare." ;;
            esac
            exit 1
          fi
        done
        # CI_CACHE_ROOT is different in kind: CI owns everything under it, so it
        # only has to be declared, not to pre-exist — a fresh host starts with an
        # empty (or absent) cache and simply takes the miss.
        if ! mkdir -p "$CI_CACHE_ROOT"; then
          echo "::error::CI_CACHE_ROOT is not creatable: $CI_CACHE_ROOT"
          exit 1
        fi
        # Every cache path derives from that one root, so no workflow has to name
        # an absolute path. These must be exported here rather than sit in the
        # caller's job-level `env:`, which is static and cannot see this step.
        #
        # PYPTO_SRC is additionally keyed by $RUNNER_NAME. CI_CACHE_ROOT is shared
        # by every runner instance on the host (only _work is per-instance), so a
        # tree keyed by job type alone is shared by concurrent runs of that job
        # from different branches — each doing `reset --hard` / `clean -ffdx` /
        # `rm -rf build` under the other. An instance runs one job at a time, so
        # keying by it makes each tree single-writer by construction, without
        # locking or giving up the cache.
        #
        # Only this tree needs it: ccache is built for concurrent access and is
        # worth far more shared, and the ptoas wheel is named by its version.
        {
          echo "CCACHE_DIR=$CI_CACHE_ROOT/$CCACHE_NAME"
          echo "PIP_CACHE_DIR=$CI_CACHE_ROOT/$PIP_CACHE_NAME"
          echo "PTOAS_CACHE_DIR=$CI_CACHE_ROOT/ptoas"
          echo "PYPTO_SRC=$CI_CACHE_ROOT/pypto-src-$BUILD_NAMESPACE-$RUNNER_NAME"
        } >> "$GITHUB_ENV"
        echo "runner config OK (checked: CI_CACHE_ROOT $required)"
        # Identity and storage of the host we landed on. These jobs run on a pool
        # of self-hosted runners that are not necessarily identically provisioned,
        # and every failure so far has been host state rather than code — so make
        # the basics visible in every log instead of guessing from a symptom.
        echo "host=$(hostname) user=$(id -un) uid=$(id -u) umask=$(umask)"
        stat -c 'cache_root %n %U:%G mode=%a' "$CI_CACHE_ROOT" || true
        findmnt -no SOURCE,FSTYPE,OPTIONS --target "$CI_CACHE_ROOT" 2>/dev/null \
          | sed 's/^/cache_fs /' || true
        df -h "$CI_CACHE_ROOT" | tail -1 | sed 's/^/cache_df /' || true
        # Prove the cache root is actually usable before anything depends on it:
        # a fresh dir, a file inside it, and removing both.
        probe="$CI_CACHE_ROOT/.write-probe-$$"
        if mkdir -p "$probe" && : > "$probe/f" && rm -rf "$probe"; then
          echo "cache_write probe OK"
        else
          echo "::error::cannot create+write+remove under $CI_CACHE_ROOT"
          stat -c '%n %U:%G mode=%a' "$probe" 2>/dev/null || true
          rm -rf "$probe" 2>/dev/null || true
          exit 1
        fi

    # Self-hosted runners reuse the workspace across runs. A prior run — or a
    # force-pushed PR ref moving refs/remotes/pull/<n>/merge — can leave the
    # checkout dir with a stale submodule object store, so actions/checkout's
    # forced submodule update dies with "fatal: Unable to find current revision
    # in submodule path ...". Try the fast incremental checkout first; on any
    # failure purge the dir and re-clone from scratch. pypto-serving is more
    # exposed to this than pypto-lib: it really does carry submodules, and the
    # pypto-lib one moves on most PRs.
    - name: Checkout pypto-serving (incremental)
      id: checkout
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        path: ${{ inputs.checkout-path }}
        # pypto-lib only — not recursive. Its kernels are consumed as source from
        # the checkout, while platform/extern/{HiCR,TaskR} are only needed by the
        # meson build in the platform-build job, which checks itself out.
        submodules: true
        persist-credentials: false

    - name: Purge stale checkout on failure
      if: steps.checkout.outcome == 'failure'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: rm -rf "${{ inputs.checkout-path }}"

    - name: Checkout pypto-serving (clean re-clone)
      if: steps.checkout.outcome == 'failure'
      uses: actions/checkout@v4
      with:
        path: ${{ inputs.checkout-path }}
        submodules: true
        persist-credentials: false

    - name: Resolve toolchain + sync pypto source
      # Sync the cached pypto checkout ONCE here; the Build step below reuses it,
      # so the toolchain pins and the installed pypto are always the same
      # revision. pypto owns ptoas (toolchain/versions.env) and pins pto-isa via
      # its runtime submodule (runtime/pto_isa.pin); read both.
      shell: bash
      run: |
        # $PYPTO_SRC is the per-job build tree exported by the loader step.
        # github.com clones/fetches over this runner's link drop mid-transfer
        # (GnuTLS recv error / early EOF), and there is no pypto gitcode mirror.
        # Tighten git's stall detection so a dead transfer aborts fast instead of
        # hanging until EOF; the cache-miss clone below also retries with backoff.
        git config --global http.postBuffer 1048576000
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60
        # Retry any git command up to 4 times with backoff (transient TLS drops).
        retry() {
          local attempt=0
          until "$@"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 4 ]; then
              echo "'$*' failed after $attempt attempts"; return 1
            fi
            echo "'$*' attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
        }
        if [ -d "$PYPTO_SRC/.git" ]; then
          echo "Cache hit — updating pypto"
          retry git -C "$PYPTO_SRC" fetch --depth=1 origin HEAD || exit 1
          git -C "$PYPTO_SRC" reset --hard FETCH_HEAD
          git -C "$PYPTO_SRC" clean -ffdx
          git -C "$PYPTO_SRC" submodule foreach --recursive 'git reset --hard && git clean -ffdx' || true
        else
          echo "Cache miss — cloning pypto"
          mkdir -p "$(dirname "$PYPTO_SRC")"
          # rm before each attempt so a retried clone never hits a partial dir.
          clone_pypto() { rm -rf "$PYPTO_SRC"; git clone --depth=1 https://github.com/hw-native-sys/pypto.git "$PYPTO_SRC"; }
          retry clone_pypto || exit 1
        fi
        retry git -C "$PYPTO_SRC" submodule update --init --recursive --depth=1 || exit 1
        rm -rf "$PYPTO_SRC/build" "$PYPTO_SRC/_skbuild" "$PYPTO_SRC/runtime/build"
        echo "pypto under test: $(git -C "$PYPTO_SRC" rev-parse HEAD)"
        # PTOAS ships one wheel per arch, with a matching PTOAS_SHA256_<ARCH> in
        # versions.env — so the arch is detected here rather than pinned, and only
        # the version has to be managed (upstream, in pypto's versions.env). An
        # unlisted arch is a hard error: a missing sha would otherwise silently
        # skip the integrity check.
        PTOAS_ARCH="$(uname -m)"
        PTOAS_SHA256=$(sed -n "s/^PTOAS_SHA256_$(echo "$PTOAS_ARCH" | tr '[:lower:]' '[:upper:]')=//p" \
          "$PYPTO_SRC/toolchain/versions.env" | tr -d '[:space:]')
        if [ -z "$PTOAS_SHA256" ]; then
          echo "::error::no PTOAS sha256 for arch '$PTOAS_ARCH' in pypto's toolchain/versions.env"
          echo "Available:"
          grep -E '^PTOAS_SHA256_' "$PYPTO_SRC/toolchain/versions.env" | sed 's/=.*//;s/^/  /'
          exit 1
        fi
        # Strip trailing CR/whitespace: a CRLF versions.env or pto_isa.pin would
        # otherwise leak a '\r' into the cache archive name and break the download.
        PTOAS_VERSION=$(grep -E '^PTOAS_VERSION=' "$PYPTO_SRC/toolchain/versions.env" \
          | cut -d= -f2 | tr -d '[:space:]')
        # Both pins are checked here for the same reason the sha above is: empty
        # is not detected where it is used. An empty version makes the release URL
        # .../download//ptoas-... and 404s; an empty pin makes the pto-isa step
        # run `git checkout ""`. Neither failure names the pin it came from.
        if [ -z "$PTOAS_VERSION" ]; then
          echo "::error::no PTOAS_VERSION= line in pypto's toolchain/versions.env"
          exit 1
        fi
        if [ ! -r "$PYPTO_SRC/runtime/pto_isa.pin" ]; then
          echo "::error::pypto has no readable runtime/pto_isa.pin"
          exit 1
        fi
        PTO_ISA_COMMIT=$(tr -d '[:space:]' < "$PYPTO_SRC/runtime/pto_isa.pin")
        if [ -z "$PTO_ISA_COMMIT" ]; then
          echo "::error::pypto's runtime/pto_isa.pin is empty"
          exit 1
        fi
        {
          echo "PTOAS_VERSION=$PTOAS_VERSION"
          echo "PTOAS_ARCH=$PTOAS_ARCH"
          echo "PTOAS_SHA256=$PTOAS_SHA256"
          echo "PTO_ISA_COMMIT=$PTO_ISA_COMMIT"
        } >> "$GITHUB_ENV"

    - name: Check NPU
      if: ${{ inputs.needs-device == 'true' }}
      shell: bash
      # Since the A5 host's driver upgrade its device nodes are
      # `crw-rw---- HwHiAiUser:HwHiAiUser`, and the CI user is not in that
      # group. dcmi_init then cannot open the character device, and npu-smi
      # exits 187 with "dcmi module initialize failed. ret is -8005" — which
      # reads like a missing DCMI component but is plain permission denial.
      # task-submit drops privileges into the HwHiAiUser group, which is how
      # every model run reaches a card in the first place.
      #
      # Direct first: on hosts whose nodes are still world-readable it works,
      # and the check then costs no device lease and no queue wait.
      run: |
        rc=0
        npu-smi info || rc=$?
        if [ "$rc" -eq 0 ]; then
          exit 0
        fi
        echo "npu-smi failed directly (exit $rc); the device nodes are likely"
        echo "group-restricted. Retrying through task-submit ..."
        # The payload ends on `rc=$?; exit $rc` rather than on `npu-smi info`:
        # with the probe as the bare last command task-submit reports 215 even
        # though npu-smi returned 0. Setting the status explicitly makes the
        # outer code npu-smi's own.
        #
        # NPUSMI_RC is a sentinel that separates the two ways this can fail.
        # task-submit leases a real card, so a busy queue makes it give up on
        # the wait and exit 1 having never run anything — that says nothing
        # about the NPU and must not fail a diagnostic step. If the sentinel is
        # present the probe really ran, and its status is authoritative.
        rc=0
        out=$(task-submit --device "${DEVICE_ID:-auto}" --timeout 240 --max-time 60 \
          --run 'npu-smi info; rc=$?; echo "NPUSMI_RC=$rc"; exit $rc' 2>&1) || rc=$?
        printf '%s\n' "$out"
        if ! printf '%s' "$out" | grep -q 'NPUSMI_RC='; then
          echo "::warning::Could not obtain a card from the device queue within"
          echo "the wait, so the NPU was never probed. Continuing — every model"
          echo "run goes through task-submit and will fail loudly if no device"
          echo "is actually available."
          exit 0
        fi
        exit "$rc"

    # Namespace the cache by pto-isa commit so a pto-isa bump can never serve
    # stale objects compiled against the old ISA headers: a different commit
    # hashes to a different key, forcing a real recompile.
    - name: Scope ccache to pto-isa version
      shell: bash
      run: echo "CCACHE_NAMESPACE=pto-isa-${PTO_ISA_COMMIT}" >> "$GITHUB_ENV"

    - name: Clone pto-isa repository (pinned)
      shell: bash
      run: |
        # PTO_ISA_ROOT belongs to the calling job's env: block, so this action
        # cannot assume it arrived. Unset, the `rm -rf` below takes an empty path
        # and the clone fails on an empty destination — neither of which points
        # back at the missing variable.
        if [ -z "${PTO_ISA_ROOT:-}" ]; then
          echo "::error::PTO_ISA_ROOT is not set — the calling job must define it"
          exit 1
        fi
        # Each composite step is a fresh shell, so re-declare the retry helper
        # here to wrap the clone in the same transient-TLS backoff as the sync
        # step above (a single network blip must not fail the whole job).
        retry() {
          local attempt=0
          until "$@"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 4 ]; then
              echo "'$*' failed after $attempt attempts"; return 1
            fi
            echo "'$*' attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
        }
        rm -rf "$PTO_ISA_ROOT"
        retry timeout 60 git clone https://github.com/hw-native-sys/pto-isa.git "$PTO_ISA_ROOT" \
          || { rm -rf "$PTO_ISA_ROOT"; retry timeout 300 git clone https://gitcode.com/luohuan40/pto-isa.git "$PTO_ISA_ROOT"; }
        cd "$PTO_ISA_ROOT"
        git checkout "$PTO_ISA_COMMIT"

    - name: Bootstrap conda + per-job venv + write activate.sh
      if: ${{ inputs.toolchain == 'conda' }}
      # Per-job venv layered on the conda env; activate.sh lets each later step
      # (and every task-submit child) enter the env with a single
      # `source activate.sh`. For device jobs it also sources set_env.sh, which
      # wires up the Ascend/HCCL host environment. LD_LIBRARY_PATH is prepended
      # with $CONDA_PREFIX/lib because ptoas needs a newer GLIBCXX than the system.
      shell: bash
      working-directory: ${{ inputs.checkout-path }}
      env:
        NEEDS_DEVICE: ${{ inputs.needs-device }}
        # Part of the runner's provisioning contract, like having task-submit /
        # npu-smi on PATH: the host provides a conda env under this name.
        CONDA_ENV: py310-serving
      run: |
        source "$CONDA_ROOT/etc/profile.d/conda.sh"
        if ! conda activate "$CONDA_ENV"; then
          echo "::error::conda env '$CONDA_ENV' not found under $CONDA_ROOT"
          echo "This runner must provide it (see the action's provisioning notes)."
          exit 1
        fi
        # Explicit reset: don't rely solely on the checkout's `git clean -ffdx`
        # to have removed a prior run's venv — a stale venv would let `python -m
        # venv` reuse it and carry over old site-packages.
        rm -rf venv
        python -m venv venv --system-site-packages
        # Bake the runner's roots in as literals rather than referencing
        # $CANN_ROOT/$CONDA_ROOT at source time: activate.sh is also sourced by
        # task-submit children, whose truncated env snapshot does not carry the
        # job's GITHUB_ENV. Same reasoning as _PYPTO_ENV_DIR below.
        {
          echo "_PYPTO_CONDA_ROOT=$CONDA_ROOT"
          echo "_PYPTO_CONDA_ENV=$CONDA_ENV"
        } > activate.sh
        if [ "$NEEDS_DEVICE" = "true" ]; then
          echo "_PYPTO_CANN_ROOT=$CANN_ROOT" >> activate.sh
        fi
        cat >> activate.sh <<'EOF'
        source "$_PYPTO_CONDA_ROOT/etc/profile.d/conda.sh"
        conda activate "$_PYPTO_CONDA_ENV"
        # Derive the venv from this script's own location instead of
        # $GITHUB_WORKSPACE: when activate.sh is sourced inside a task-submit
        # child, a truncated env snapshot could drop $GITHUB_WORKSPACE and point
        # the source at a wrong/absent path. BASH_SOURCE is snapshot-independent.
        _PYPTO_ENV_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        source "$_PYPTO_ENV_DIR/venv/bin/activate"
        EOF
        if [ "$NEEDS_DEVICE" = "true" ]; then
          printf '%s\n' 'source "$_PYPTO_CANN_ROOT/set_env.sh"' >> activate.sh
        fi
        # ${LD_LIBRARY_PATH:+:...} so an empty inherited value yields no trailing
        # colon, which the loader would read as the current directory.
        printf '%s\n' 'export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' >> activate.sh

    - name: Enter the toolchain bundle + per-job venv + write activate.sh
      if: ${{ inputs.toolchain == 'bundle' }}
      # Same contract as the conda step it replaces: a per-job venv and an
      # activate.sh that any later step, and any task-submit child, enters with
      # one `source activate.sh`. What changes is where Python and GCC come from.
      shell: bash
      working-directory: ${{ inputs.checkout-path }}
      env:
        NEEDS_DEVICE: ${{ inputs.needs-device }}
      run: |
        # Assert what this build needs rather than a bundle version, so the
        # fleet can be upgraded without editing this file. ccache >= 4.8 is a
        # correctness requirement: below it CCACHE_NAMESPACE is silently
        # ignored, and that is how the compile cache is scoped to the pinned
        # pto-isa commit.
        pypto-toolchain verify \
          --require python=3.10 --require 'gcc>=15' --require 'ccache>=4.8'
        # Where the bundle lives is host layout, so it comes from the runner's
        # .env like CONDA_ROOT and CANN_ROOT — the default is only what the
        # fleet happens to use today, not something a differently-laid-out host
        # has to adopt.
        #
        # Deliberately NOT named PYPTO_TOOLCHAIN_ROOT: `pypto-toolchain` reads
        # that one itself, as its install root — the dir holding each installed
        # version, with `current` a symlink it manages via `use <version>`.
        TOOLCHAIN_BUNDLE_ROOT="${TOOLCHAIN_BUNDLE_ROOT:-/opt/pypto/toolchain/current}"
        if [ ! -r "$TOOLCHAIN_BUNDLE_ROOT/activate.sh" ]; then
          echo "::error::no toolchain bundle at $TOOLCHAIN_BUNDLE_ROOT"
          echo "Install it there, or point this runner at its own location by"
          echo "adding a bare TOOLCHAIN_BUNDLE_ROOT=... line to <runner-root>/.env."
          exit 1
        fi
        source "$TOOLCHAIN_BUNDLE_ROOT/activate.sh"

        rm -rf venv
        # No --system-site-packages. Nothing outside the venv is depended on
        # now, which also retires the trap that flag created: with it, a failed
        # install in the venv was masked by a copy of pypto in the base env.
        python3.10 -m venv venv

        # PYPTO_TOOLCHAIN is written in as a literal, exactly as the conda roots
        # were: activate.sh is also sourced by task-submit children, whose env
        # snapshot is truncated and carries neither GITHUB_ENV nor this value.
        echo "_PYPTO_TOOLCHAIN=$PYPTO_TOOLCHAIN" > activate.sh
        if [ "$NEEDS_DEVICE" = "true" ]; then
          echo "_PYPTO_CANN_ROOT=$CANN_ROOT" >> activate.sh
          # Sourced BEFORE the bundle: set_env.sh prepends its own directories
          # to LD_LIBRARY_PATH and the bundle's libstdc++ has to stay ahead of
          # them — ptoas needs GLIBCXX_3.4.29, the host stops at 3.4.28. The
          # conda path got this by prepending $CONDA_PREFIX/lib last.
          printf '%s\n' 'source "$_PYPTO_CANN_ROOT/set_env.sh"' >> activate.sh
        fi
        cat >> activate.sh <<'EOF'
        source "$_PYPTO_TOOLCHAIN/activate.sh"
        # BASH_SOURCE, not $GITHUB_WORKSPACE: a task-submit child's truncated
        # env snapshot may not carry the workspace path.
        _PYPTO_ENV_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        source "$_PYPTO_ENV_DIR/venv/bin/activate"
        EOF

        # Prove the file works before ten minutes of building depend on it, and
        # re-assert the requirements against the tools it actually puts on PATH.
        # `pypto-toolchain verify` above speaks for the bundle that command
        # manages, which is not necessarily the one at TOOLCHAIN_BUNDLE_ROOT; only
        # this check sees what the build will really run.
        ( source activate.sh
          command -v python3.10 g++-15 ccache uv >/dev/null
          python3.10 -c 'import sys; assert sys.version_info[:2]==(3,10)'
          gxx_version=$(g++-15 -dumpversion)
          gxx_major=${gxx_version%%.*}
          case "$gxx_major" in
            ''|*[!0-9]*)
              echo "::error::cannot read a g++-15 major version from '$gxx_version'"
              exit 1 ;;
          esac
          if [ "$gxx_major" -lt 15 ]; then
            echo "::error::g++-15 reports $gxx_version, need >= 15"
            exit 1
          fi
          # Probe the behaviour, not the version string. `namespace` is a
          # ccache 4.x key; 3.x drops CCACHE_NAMESPACE with no error and no
          # warning, so the cache silently stops being scoped to the pinned
          # pto-isa commit.
          if ! ccache -p | grep -q 'namespace'; then
            echo "::error::this ccache ignores CCACHE_NAMESPACE (needs >= 4.8)"
            echo "ccache: $(command -v ccache) $(ccache --version | head -1)"
            exit 1
          fi )
        echo "toolchain: $(source activate.sh >/dev/null 2>&1; g++-15 -dumpversion) / $(source activate.sh >/dev/null 2>&1; python3.10 -V 2>&1)"

    - name: Show ccache stats (before)
      shell: bash
      run: ccache -s || true

    - name: Build and install pypto and simpler
      # Reuses the pypto source synced by the resolve step above (same revision
      # the toolchain pins were read from).
      shell: bash
      working-directory: ${{ inputs.checkout-path }}
      run: |
        source activate.sh
        python -m pip install --upgrade pip
        # Constrained deliberately. Unconstrained, a transient index failure on
        # one transitive dependency sends pip backtracking through sixty
        # releases of scikit-build-core before reporting it, burying the real
        # message under a wall of version lists.
        # nanobind is capped below 3.0 to match pypto's own build requirement.
        # It has to be pinned here rather than inherited: the pypto build below
        # passes --no-build-isolation, so the extension is compiled against this
        # install and pypto's [build-system] requires is never consulted.
        # nanobind 3.0 stopped binding a null holder to a parameter typed after a
        # bound class, which is what pypto's TileView uses for `start_offset`, so
        # `ir.TileView()` no longer matches its own all-defaulted overload and
        # every `pl.Tile` annotation fails to parse.
        pip install 'scikit-build-core>=0.10' 'nanobind<3' cmake ninja
        # torch BEFORE pypto is built. pypto declares torch>=2.0.0, and if it is
        # not installed yet pip resolves that from the default index, where the
        # aarch64 wheel now drags ~1.5 GB of CUDA onto an Ascend host. Under
        # conda this never showed: the base env already carried a torch, which
        # turned out to be the only thing pinning it. The serving deps installed
        # further down (transformers et al.) depend on torch too, so this must
        # come first for them as well.
        #
        # Pinned to what the conda env this migration replaces carried, so the
        # toolchain is the only thing that changes: py310-lib resolved
        # torch>=2.0.0 to 2.6.0, while an unpinned install takes the newest
        # (2.13.0 today). torch itself stays a serving dependency (tensors,
        # dtypes, weights, sampling); torch_npu is no longer installed — the
        # KV-cache sizing queries the worker's device_memory_info instead.
        #
        # The CPU index is not a preference either, so an unreachable one is
        # retried rather than swapped for the default index: the same pin resolves
        # to a CUDA-bundling wheel there, which is the whole thing this is
        # avoiding. Better to fail naming the index than to quietly install a
        # different build of the version the pin asks for.
        TORCH_PIN='torch==2.6.0'
        torch_ok=0
        for attempt in 1 2 3; do
          if pip install "$TORCH_PIN" --index-url https://download.pytorch.org/whl/cpu; then
            torch_ok=1
            break
          fi
          echo "::warning::$TORCH_PIN attempt $attempt failed; retrying in $((attempt * 10))s"
          sleep $((attempt * 10))
        done
        if [ "$torch_ok" -ne 1 ]; then
          echo "::error::cannot install $TORCH_PIN from download.pytorch.org/whl/cpu"
          exit 1
        fi
        # The from-source pypto / simpler builds compile native code (libbacktrace
        # et al.), which intermittently fails to configure on this host ("C
        # compiler cannot create executables"). Retry a few times, purging the
        # stale build tree first so a half-written configure / ccache state from
        # the failed attempt can't poison the retry.
        retry_build() {
          local target="$1" attempt=0
          until pip install --no-build-isolation "$target"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "build of '$target' failed after $attempt attempts"; return 1
            fi
            echo "build of '$target' attempt $attempt failed; cleaning and retrying in $((attempt * 10))s"
            # Purge the retrying target's own build trees (scikit-build-core may
            # use either build/ or _skbuild/), so a half-written configure state
            # can't poison the retry.
            rm -rf "$target/build" "$target/_skbuild"
            sleep $((attempt * 10))
          done
        }
        retry_build "$PYPTO_SRC" || exit 1
        retry_build "$PYPTO_SRC/runtime" || exit 1

    - name: Install pypto-serving and its dependencies
      shell: bash
      working-directory: ${{ inputs.checkout-path }}
      run: |
        source activate.sh
        # torch is installed in the build step above, before pypto is resolved.
        # 'nanobind<3': same cap as the build step above.
        pip install 'nanobind<3' transformers safetensors numpy fastapi uvicorn pytest msgspec
        # --no-deps: pyproject declares none, and the runtime stack above is
        # deliberately assembled by hand (CPU torch, from-source pypto).
        pip install --no-deps -e .

    - name: Show ccache stats (after)
      shell: bash
      run: ccache -s || true

    - name: Install ptoas (local cache)
      # $PTOAS_CACHE_DIR (ci-cache/ptoas) comes from the loader step. Runs after
      # the bootstrap step on purpose: the wheel is cp310-only and the
      # interpreter it must match is whichever activate.sh selected, conda env
      # or toolchain bundle — so this step asks that env rather than naming one.
      shell: bash
      working-directory: ${{ inputs.checkout-path }}
      run: |
        # Like PTO_ISA_ROOT, this is the caller's job env rather than ours.
        # Checked before the `rm -rf` below, which unset would aim at nothing.
        if [ -z "${PTOAS_ROOT:-}" ]; then
          echo "::error::PTOAS_ROOT is not set — the calling job must define it"
          exit 1
        fi
        # Since v0.55 the release ships no per-arch ptoas-bin tarball, and its
        # standalone archive requires CPython 3.11 while this CI runs 3.10.
        # Install the matching cp310 wheel into an isolated venv, which keeps
        # the PTOAS_ROOT/bin/ptoas layout pypto's ptoas discovery accepts.
        #
        # The cache entry is named exactly as the release asset, so it is the
        # same file the pypto repo's own jobs put in this shared dir.
        PTOAS_PACKAGE_VERSION="${PTOAS_VERSION#v}"
        PTOAS_WHEEL_NAME="ptoas-${PTOAS_PACKAGE_VERSION}-cp310-cp310-manylinux_2_34_${PTOAS_ARCH}.whl"
        CACHE_WHEEL="$PTOAS_CACHE_DIR/$PTOAS_WHEEL_NAME"
        download_ptoas() {
          echo "Downloading ptoas ${PTOAS_VERSION} for ${PTOAS_ARCH}"
          mkdir -p "$PTOAS_CACHE_DIR"
          # Unique per-process temp file: a shared "$CACHE_WHEEL.tmp" would let
          # two concurrent cache-miss jobs clobber each other's download. The
          # dot prefix keeps a partial download from looking like a wheel.
          local tmp
          tmp="$(mktemp "$PTOAS_CACHE_DIR/.ptoas-${PTOAS_ARCH}.XXXXXX")"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/hw-native-sys/PTOAS/releases/download/${PTOAS_VERSION}/${PTOAS_WHEEL_NAME}" \
            -o "$tmp"
          echo "${PTOAS_SHA256}  $tmp" | sha256sum -c -
          mv -f "$tmp" "$CACHE_WHEEL"
        }
        if [ ! -f "$CACHE_WHEEL" ]; then
          echo "Cache miss"
          download_ptoas
        elif ! echo "${PTOAS_SHA256}  $CACHE_WHEEL" | sha256sum -c -; then
          echo "Cache corrupted — removing and re-downloading"
          rm -f "$CACHE_WHEEL"
          download_ptoas
        else
          echo "Cache hit — using $CACHE_WHEEL"
        fi
        # activate.sh gives both the interpreter and the LD_LIBRARY_PATH ptoas
        # needs (it wants a newer GLIBCXX than these hosts carry), for either
        # toolchain. The venv is created from it rather than from a named conda
        # env so 'bundle' jobs are not silently pinned to a conda python.
        source activate.sh
        # The wheel is cp310-only: pip would reject it with "not a supported
        # wheel on this platform", which does not say that the *environment* is
        # the wrong version. Say it here instead.
        py_version="$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
        if [ "$py_version" != "3.10" ]; then
          echo "::error::ptoas ${PTOAS_VERSION} ships a cp310 wheel, but this job's python is $py_version"
          exit 1
        fi
        rm -rf "$PTOAS_ROOT"
        python -m venv "$PTOAS_ROOT" --system-site-packages
        "$PTOAS_ROOT/bin/python" -m pip install "$CACHE_WHEEL"
        "$PTOAS_ROOT/bin/ptoas" --version
