name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: pre-commit/action@v3.0.0
        with:
          extra_args: --all-files

  # Qwen3-14B accuracy + serving guards (single card each). The 8-card DeepSeek
  # V4 guard is a separate job (unit-tests-deepseek) so the two models schedule
  # independently and the expensive 8-card borrow does not serialize behind the
  # single-card qwen3 runs.
  unit-tests-qwen:
    runs-on: [self-hosted, linux, arm64, npu]
    timeout-minutes: 120
    defaults:
      run:
        working-directory: dist-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/dist-checkout/ptoas-bin
      PTO_ISA_ROOT: ${{ github.workspace }}/dist-checkout/pto-isa
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # The cache paths are exported by setup-ci-job from the runner config's
      # CI_CACHE_ROOT — a static job-level env: cannot see a step's output.
      # 000 keeps ccache files mutually writable across concurrent jobs.
      CCACHE_UMASK: '000'

    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./dist-checkout — sparse-fetch
        # just the action defs at the workspace root first (clean: false leaves
        # sibling subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: dist-checkout
          needs-device: 'true'
          build-namespace: pypto-serving
          # Dedicated serving ccache, shared among serving jobs but kept apart
          # from other repos' a2a3/sim caches on this host.
          ccache-name: ccache-serving
          pip-cache-name: pip-serving-qwen

      - name: Run Qwen3 accuracy guard
        env:
          PYTHONPATH: ${{ github.workspace }}/dist-checkout
          PTO2_RING_DEP_POOL: 16384
          PTO2_RING_TASK_WINDOW: 16384
          PTO2_RING_HEAP: 1073741824
        run: |
          # PYPTO_QWEN3_MODEL_DIR comes from the runner's .env (loaded into every
          # job) — no absolute path lives in git. Fail loudly if it is missing.
          : "${PYPTO_QWEN3_MODEL_DIR:?not set — add it to this runner's .env}"
          [ -d "$PYPTO_QWEN3_MODEL_DIR" ] || {
            echo "::error::PYPTO_QWEN3_MODEL_DIR points at a missing dir: $PYPTO_QWEN3_MODEL_DIR"
            exit 1
          }
          source activate.sh
          run_cmd="cd $GITHUB_WORKSPACE/dist-checkout"
          run_cmd="$run_cmd && source activate.sh"
          run_cmd="$run_cmd && DEVICE_ID=\$TASK_DEVICE"
          run_cmd="$run_cmd PYTHONPATH=$PYTHONPATH"
          run_cmd="$run_cmd PYPTO_QWEN3_MODEL_DIR=$PYPTO_QWEN3_MODEL_DIR"
          run_cmd="$run_cmd PTO2_RING_DEP_POOL=$PTO2_RING_DEP_POOL"
          run_cmd="$run_cmd PTO2_RING_TASK_WINDOW=$PTO2_RING_TASK_WINDOW"
          run_cmd="$run_cmd PTO2_RING_HEAP=$PTO2_RING_HEAP"
          run_cmd="$run_cmd python -m pytest tests/test_qwen3_accuracy.py -q -s"
          task-submit --device auto --timeout 3600 --max-time 1800 --run "$run_cmd"

      - name: Run Qwen3 serving guard (prefix cache, chunked prefill, multi-batch)
        env:
          PYTHONPATH: ${{ github.workspace }}/dist-checkout
          PTO2_RING_DEP_POOL: 16384
          PTO2_RING_TASK_WINDOW: 16384
          PTO2_RING_HEAP: 1073741824
        run: |
          : "${PYPTO_QWEN3_MODEL_DIR:?not set — add it to this runner's .env}"
          [ -d "$PYPTO_QWEN3_MODEL_DIR" ] || {
            echo "::error::PYPTO_QWEN3_MODEL_DIR points at a missing dir: $PYPTO_QWEN3_MODEL_DIR"
            exit 1
          }
          source activate.sh
          run_cmd="cd $GITHUB_WORKSPACE/dist-checkout"
          run_cmd="$run_cmd && source activate.sh"
          run_cmd="$run_cmd && DEVICE_ID=\$TASK_DEVICE"
          run_cmd="$run_cmd PYTHONPATH=$PYTHONPATH"
          run_cmd="$run_cmd PYPTO_QWEN3_MODEL_DIR=$PYPTO_QWEN3_MODEL_DIR"
          run_cmd="$run_cmd PTO2_RING_DEP_POOL=$PTO2_RING_DEP_POOL"
          run_cmd="$run_cmd PTO2_RING_TASK_WINDOW=$PTO2_RING_TASK_WINDOW"
          run_cmd="$run_cmd PTO2_RING_HEAP=$PTO2_RING_HEAP"
          run_cmd="$run_cmd python -m pytest tests/test_qwen3_serving.py -q -s"
          task-submit --device auto --timeout 3600 --max-time 1800 --run "$run_cmd"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: dist-checkout

      - name: Clean up build artifacts
        if: always()
        run: rm -rf build_output

  # DeepSeek V4 HTTP-generation accuracy guard — the 8-card (--device-num 8) run,
  # split out of unit-tests so the 8-card borrow schedules independently of the
  # single-card qwen3 runs. Same setup contract as unit-tests.
  unit-tests-deepseek:
    runs-on: [self-hosted, linux, arm64, npu]
    timeout-minutes: 120
    defaults:
      run:
        working-directory: dist-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/dist-checkout/ptoas-bin
      PTO_ISA_ROOT: ${{ github.workspace }}/dist-checkout/pto-isa
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'

    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: dist-checkout
          needs-device: 'true'
          build-namespace: pypto-serving
          ccache-name: ccache-serving
          # Own pip dir: the qwen and deepseek jobs always run together, so a
          # shared pip cache would have them writing the same dir concurrently.
          pip-cache-name: pip-serving-deepseek

      - name: Run DeepSeek V4 HTTP generation accuracy guard
        env:
          PYPTO_RUNTIME_LOG: error
          PTO2_RING_DEP_POOL: 131072
          PTO2_RING_TASK_WINDOW: 131072
          PTO2_RING_HEAP: 2147483648
          PTO2_OP_EXECUTE_TIMEOUT_US: 400000000
          PTO2_STREAM_SYNC_TIMEOUT_MS: 440000
          PTO2_SCHEDULER_TIMEOUT_MS: 320000
          SERVING_WORKER_STEP_TIMEOUT: 1800
        run: |
          : "${PYPTO_DSV4_MODEL_DIR:?not set — add it to this runner's .env}"
          [ -d "$PYPTO_DSV4_MODEL_DIR" ] || {
            echo "::error::PYPTO_DSV4_MODEL_DIR points at a missing dir: $PYPTO_DSV4_MODEL_DIR"
            exit 1
          }
          source activate.sh
          run_cmd="cd $GITHUB_WORKSPACE/dist-checkout"
          run_cmd="$run_cmd && source activate.sh"
          run_cmd="$run_cmd && TASK_DEVICE=\$TASK_DEVICE"
          run_cmd="$run_cmd PYTHONPATH=$GITHUB_WORKSPACE/dist-checkout"
          run_cmd="$run_cmd PYPTO_DSV4_MODEL_DIR=$PYPTO_DSV4_MODEL_DIR"
          run_cmd="$run_cmd PYPTO_RUNTIME_LOG=$PYPTO_RUNTIME_LOG"
          run_cmd="$run_cmd PTO2_RING_DEP_POOL=$PTO2_RING_DEP_POOL"
          run_cmd="$run_cmd PTO2_RING_TASK_WINDOW=$PTO2_RING_TASK_WINDOW"
          run_cmd="$run_cmd PTO2_RING_HEAP=$PTO2_RING_HEAP"
          run_cmd="$run_cmd PTO2_OP_EXECUTE_TIMEOUT_US=$PTO2_OP_EXECUTE_TIMEOUT_US"
          run_cmd="$run_cmd PTO2_STREAM_SYNC_TIMEOUT_MS=$PTO2_STREAM_SYNC_TIMEOUT_MS"
          run_cmd="$run_cmd PTO2_SCHEDULER_TIMEOUT_MS=$PTO2_SCHEDULER_TIMEOUT_MS"
          run_cmd="$run_cmd SERVING_WORKER_STEP_TIMEOUT=$SERVING_WORKER_STEP_TIMEOUT"
          run_cmd="$run_cmd python -m pytest tests/test_deepseek_v4_accuracy.py -q -s"
          task-submit --device auto --device-num 8 --ignore-whitelist \
            --timeout 3600 --max-time 2700 \
            --run "$run_cmd"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: dist-checkout

      - name: Clean up build artifacts
        if: always()
        run: rm -rf build_output

  platform-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y meson ninja-build libhwloc-dev libboost-context-dev libopenmpi-dev
          python3 -m pip install 'clang-format==18.1.0'

      - name: Check style
        run: |
          python3 platform/extern/HiCR/extern/run-clang-format/run-clang-format.py \
            --recursive platform/include platform/examples \
            --extensions "hpp,cpp" --exclude "*/build/*"

      - name: Configure
        run: meson setup platform/build platform/ -Dengines=mpi -DbuildTests=true

      - name: Build
        run: ninja -C platform/build

      - name: Test
        run: meson test -C platform/build --suite examples --timeout-multiplier 2
