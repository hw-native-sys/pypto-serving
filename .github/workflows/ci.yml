name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr230-prefix-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prefix-cache-diagnostic:
    runs-on: [self-hosted, linux, arm64, npu]
    timeout-minutes: 120
    env:
      PTOAS_ROOT: ${{ github.workspace }}/dist-checkout/ptoas-bin
      PTO_ISA_ROOT: ${{ github.workspace }}/dist-checkout/pto-isa
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'
      DIAGNOSTIC_DIR: ${{ github.workspace }}/prefix-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Prepare diagnostic output
        run: mkdir -p "$DIAGNOSTIC_DIR"

      - name: Resolve model directory
        run: test -n "${PYPTO_DSV4_MODEL_DIR:-}" && test -d "$PYPTO_DSV4_MODEL_DIR"

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: dist-checkout
          needs-device: 'true'
          toolchain: bundle
          build-namespace: pypto-serving
          pip-cache-name: pip-pypto-serving

      - name: Record source revisions
        run: |
          {
            echo "serving=$(git -C "$GITHUB_WORKSPACE/dist-checkout" rev-parse HEAD)"
            echo "pypto=$(git -C "$PYPTO_SRC" rev-parse HEAD)"
            echo "runtime=$(git -C "$PYPTO_SRC/runtime" rev-parse HEAD)"
            echo "pypto_lib=$(git -C "$GITHUB_WORKSPACE/dist-checkout/pypto-lib" rev-parse HEAD)"
            echo "ptoas=$PTOAS_VERSION"
            echo "pto_isa=$PTO_ISA_COMMIT"
            echo "host=$(hostname)"
          } > "$DIAGNOSTIC_DIR/revisions.txt"

      - name: Run only K1 prefix-cache diagnostic
        shell: bash
        run: |
          set -euo pipefail
          printf -v run_cmd 'bash %q %q' \
            "$GITHUB_WORKSPACE/dist-checkout/.github/scripts/diagnose-prefix-cache.sh" \
            "$DIAGNOSTIC_DIR"
          task-submit --device auto --device-num 8 --ignore-whitelist \
            --env PYPTO_DSV4_MODEL_DIR --timeout 4800 --max-time 3600 \
            --run "$run_cmd" 2>&1 | tee "$DIAGNOSTIC_DIR/task-submit.log"
          test "$(cat "$DIAGNOSTIC_DIR/pytest-exit-code.txt")" = 0

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: dist-checkout

      - name: Collect generated kernel sources
        if: always()
        run: |
          build_dir="$GITHUB_WORKSPACE/dist-checkout/build_output"
          if [ -d "$build_dir" ]; then
            find "$build_dir" -type f \
              \( -name '*.cpp' -o -name '*.h' \) -print0 \
              | tar --null -T - -czf "$DIAGNOSTIC_DIR/kernel-sources.tar.gz"
          fi

      - name: Upload full diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr230-prefix-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DIAGNOSTIC_DIR }}
          if-no-files-found: warn
          retention-days: 7
