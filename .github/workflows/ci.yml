name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: pre-commit/action@v3.0.0
        with:
          extra_args: --all-files

  unit-tests:
    uses: ./.github/workflows/serving-guard-a2a3.yml
    with:
      # DSpark HC-pre requires the compact-accumulator lowering from PyPTO PR #3489.
      pypto-revision: b943b5fc672ebf6d2d715d8db27abf71b07a9278

  v41-a5-smoke:
    uses: ./.github/workflows/serving-guard-a5.yml
    with:
      # Keep serving CI on the compiler validated before PyPTO PR #3411.
      pypto-revision: 3db18db1286bdbb44266179e3aedae659174b711
