name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: pre-commit/action@v3.0.0
        with:
          extra_args: --all-files

  unit-tests:
    runs-on: [self-hosted, linux, arm64, npu]
    # Shared devices can stay occupied for more than an hour. Let Qwen guards
    # wait within this job budget, with separate 30-minute execution limits.
    # The always() cleanup cancels this job's tasks when the job times out.
    timeout-minutes: 420
    env:
      PTOAS_ROOT: ${{ github.workspace }}/dist-checkout/ptoas-bin
      PTO_ISA_ROOT: ${{ github.workspace }}/dist-checkout/pto-isa
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Shared with the other repos' jobs on this host, so 000 keeps cache files
      # mutually writable whichever user wrote them first. The cache *paths* are
      # exported by setup-ci-job from the runner config's CI_CACHE_ROOT — a
      # static job-level env: cannot see a step's output.
      CCACHE_UMASK: '000'

    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Resolve model dirs
        # setup-ci-job checks the runner config it needs itself; the model
        # weights are only needed by the steps below, so they are checked here.
        # Before the setup on purpose: this reads nothing but the runner's own
        # .env, and behind it lies the checkout, the toolchain and a from-source
        # build of pypto — so a host missing a model dir must fail with an
        # actionable message now, not forty minutes later inside pytest as an
        # opaque missing-path error.
        run: |
          set -uo pipefail
          bad=0
          for key in \
            PYPTO_QWEN3_MODEL_DIR \
            PYPTO_DSV4_DSPARK_MODEL_DIR; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              echo "::error::$key is not set — add it to this runner's .env"
              bad=1
            elif [ ! -d "$value" ]; then
              echo "::error::$key points at a missing directory: $value"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "The runner declares its host layout in <runner-root>/.env,"
            echo "one bare KEY=VALUE per line (no quotes, no trailing comments);"
            echo "restart the runner service after editing it."
            exit 1
          fi
          echo "model dirs resolved from the runner config"

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: dist-checkout
          needs-device: 'true'
          runtime-platform: a2a3
          # This compiler passed the A3 guards with the bundled Lib. Drop the
          # pin after its DSpark kernels migrate to explicit AIV splitting.
          pypto-revision: 1dedb26c329407360c5c5ce6ecb495565c2f154e
          toolchain: bundle
          # CI_CACHE_ROOT is shared with pypto and pypto-lib, whose jobs already
          # claim `serving` / `pip-serving`. Name both after this repo so the two
          # never land on one dir.
          build-namespace: pypto-serving
          pip-cache-name: pip-pypto-serving

      - name: Run compiler runtime CPU guards
        env:
          TORCH_DEVICE_BACKEND_AUTOLOAD: '0'
        run: |
          source "$GITHUB_WORKSPACE/dist-checkout/activate.sh"
          cd "$GITHUB_WORKSPACE/dist-checkout"
          python -m pytest -q \
            tests/unit/test_ci_runtime_build.py \
            tests/unit/model/common/test_kernel_compiler.py \
            tests/unit/model/common/test_kernel_compiler_codegen.py \
            tests/unit/model/qwen/test_npu_executor.py

      - name: Run Serving scheduler and worker CPU guards
        env:
          TORCH_DEVICE_BACKEND_AUTOLOAD: '0'
        run: |
          source "$GITHUB_WORKSPACE/dist-checkout/activate.sh"
          cd "$GITHUB_WORKSPACE/dist-checkout"
          python -m pytest tests/unit/serving -q

      - name: Run Qwen3 accuracy guard
        env:
          PYTHONPATH: ${{ github.workspace }}/dist-checkout
        run: |
          source "$GITHUB_WORKSPACE/dist-checkout/activate.sh"
          run_cmd="cd $GITHUB_WORKSPACE/dist-checkout"
          run_cmd="$run_cmd && source activate.sh"
          run_cmd="$run_cmd && DEVICE_ID=\$TASK_DEVICE"
          run_cmd="$run_cmd PYTHONPATH=$PYTHONPATH"
          run_cmd="$run_cmd PYPTO_QWEN3_MODEL_DIR=$PYPTO_QWEN3_MODEL_DIR"
          run_cmd="$run_cmd python -m pytest tests/test_qwen3_accuracy.py -q -s"
          task-submit --device auto --timeout 0 --max-time 1800 --run "$run_cmd"

      - name: Run Qwen3 serving guard (prefix cache, chunked prefill, multi-batch)
        env:
          PYTHONPATH: ${{ github.workspace }}/dist-checkout
        run: |
          source "$GITHUB_WORKSPACE/dist-checkout/activate.sh"
          run_cmd="cd $GITHUB_WORKSPACE/dist-checkout"
          run_cmd="$run_cmd && source activate.sh"
          run_cmd="$run_cmd && DEVICE_ID=\$TASK_DEVICE"
          run_cmd="$run_cmd PYTHONPATH=$PYTHONPATH"
          run_cmd="$run_cmd PYPTO_QWEN3_MODEL_DIR=$PYPTO_QWEN3_MODEL_DIR"
          run_cmd="$run_cmd python -m pytest tests/test_qwen3_serving.py -q -s"
          task-submit --device auto --timeout 0 --max-time 1800 --run "$run_cmd"

      - name: Fetch Qwen HBG model kernels
        uses: actions/checkout@v4
        with:
          repository: hw-native-sys/pypto-lib
          ref: da5350d2bfc40ce12edeaafd44b698050f6dc85b
          path: qwen-hbg-lib
          persist-credentials: false

      - name: Run Qwen3 HBG serving guard (prefix cache, chunked prefill, multi-batch)
        run: |
          source "$GITHUB_WORKSPACE/dist-checkout/activate.sh"
          printf -v lib_root '%q' "$GITHUB_WORKSPACE/qwen-hbg-lib"
          run_cmd="cd $GITHUB_WORKSPACE/dist-checkout"
          run_cmd="$run_cmd && source activate.sh"
          run_cmd="$run_cmd && DEVICE_ID=\$TASK_DEVICE"
          run_cmd="$run_cmd PYTHONPATH=$GITHUB_WORKSPACE/dist-checkout"
          run_cmd="$run_cmd PYPTO_QWEN3_MODEL_DIR=$PYPTO_QWEN3_MODEL_DIR"
          run_cmd="$run_cmd PYPTO_QWEN3_RUNTIME=host_build_graph PYPTO_LIB_ROOT=$lib_root"
          run_cmd="$run_cmd python -m pytest tests/test_qwen3_serving.py -q -s"
          task-submit --device auto --timeout 0 --max-time 1800 --run "$run_cmd"

      - name: Run DSpark HTTP guard (K=7, one 8-card server)
        env:
          PYPTO_RUNTIME_LOG: error
          PYPTO_DSPARK_EP_SIZE: '8'
          PYPTO_DSPARK_RING_HEAP: '1073741824,1073741824,2147483648,4294967296'
          PYPTO_DSPARK_DRAFTER_RING_HEAP: '1073741824,1073741824,1073741824,1073741824'
        run: |
          source "$GITHUB_WORKSPACE/dist-checkout/activate.sh"
          run_cmd="cd $GITHUB_WORKSPACE/dist-checkout"
          run_cmd="$run_cmd && source activate.sh"
          run_cmd="$run_cmd && TASK_DEVICE=\$TASK_DEVICE"
          run_cmd="$run_cmd PYTHONPATH=$GITHUB_WORKSPACE/dist-checkout"
          run_cmd="$run_cmd PYPTO_DSV4_DSPARK_MODEL_DIR=$PYPTO_DSV4_DSPARK_MODEL_DIR"
          run_cmd="$run_cmd PYPTO_RUNTIME_LOG=$PYPTO_RUNTIME_LOG"
          run_cmd="$run_cmd PYPTO_DSPARK_EP_SIZE=$PYPTO_DSPARK_EP_SIZE"
          run_cmd="$run_cmd PYPTO_DSPARK_RING_HEAP=$PYPTO_DSPARK_RING_HEAP"
          run_cmd="$run_cmd PYPTO_DSPARK_DRAFTER_RING_HEAP=$PYPTO_DSPARK_DRAFTER_RING_HEAP"
          # One 8-card EP8/TP4 server for the whole guard: the cold greedy palace
          # request checks generation correctness, then a different prompt run
          # twice exercises prefix cache on the same boot. Selecting by node
          # id also makes a renamed case id fail collection instead of
          # silently widening the run.
          run_cmd="$run_cmd python -m pytest 'tests/test_deepseek_dspark_accuracy.py::test_dspark_http_k7_one_server' -q -s"
          task-submit --device auto --device-num 8 --ignore-whitelist \
            --timeout 4800 --max-time 7200 \
            --run "$run_cmd"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: dist-checkout

  v41-a5-smoke:
    # The A5 runner must provide PYPTO_DSV41_MODEL_DIR.
    # It may also provide PYPTO_V41_PREPACKED_WEIGHTS for the same DP4 checkpoint.
    runs-on: [self-hosted, linux, npu-a5]
    timeout-minutes: 180
    env:
      PTOAS_ROOT: ${{ github.workspace }}/dist-checkout/ptoas-bin
      PTO_ISA_ROOT: ${{ github.workspace }}/dist-checkout/pto-isa
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'

    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Resolve V4.1 model directory
        run: |
          if [ -z "${PYPTO_DSV41_MODEL_DIR:-}" ] || [ ! -d "$PYPTO_DSV41_MODEL_DIR" ]; then
            echo "::error::PYPTO_DSV41_MODEL_DIR must point to the V4.1 checkpoint on this A5 runner"
            exit 1
          fi

      - name: Resolve duplicated CANN root for this job
        # Remove after the A5 runner CANN_ROOT values are repaired.
        run: |
          root="${CANN_ROOT:-}"
          parent="${root%/*}"
          if [ ! -d "$root" ] && [ -n "$parent" ] && \
             [ "${root##*/}" = "${parent##*/}" ] && [ -f "$parent/set_env.sh" ]; then
            printf 'Using installed CANN root for this job: %s\n' "$parent"
            printf 'CANN_ROOT=%s\n' "$parent" >> "$GITHUB_ENV"
          fi

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: dist-checkout
          needs-device: 'true'
          runtime-platform: a5
          # The K5 guard passed with this compiler and the bundled Lib. Revisit
          # after the V4.1 dynamic-shape bindings compile on PyPTO main.
          pypto-revision: e1508f6ddad12dbe0640e1c22b644c14ce088395
          toolchain: bundle
          build-namespace: pypto-serving-v41-a5
          pip-cache-name: pip-pypto-serving-v41-a5

      - name: Run V4.1 DSpark HTTP guard (K=5, one 4-card server)
        env:
          # Cold K5 startup compiles the draft programs and stages real weights.
          PYPTO_WORKER_INIT_TIMEOUT: '3600'
        run: |
          source "$GITHUB_WORKSPACE/dist-checkout/activate.sh"
          printf -v cache_dir '%q' "$CI_CACHE_ROOT/jit-pypto-serving-v41-$RUNNER_NAME"
          run_cmd="cd $GITHUB_WORKSPACE/dist-checkout"
          run_cmd="$run_cmd && source activate.sh"
          run_cmd="$run_cmd && TASK_DEVICE=\$TASK_DEVICE"
          run_cmd="$run_cmd PYTHONPATH=$GITHUB_WORKSPACE/dist-checkout"
          run_cmd="$run_cmd PYPTO_DSV41_MODEL_DIR=$PYPTO_DSV41_MODEL_DIR"
          run_cmd="$run_cmd PYPTO_WORKER_INIT_TIMEOUT=$PYPTO_WORKER_INIT_TIMEOUT"
          run_cmd="$run_cmd PYPTO_CACHE=1 PYPTO_CACHE_READONLY=0 PYPTO_CACHE_DIR=$cache_dir"
          if [ -n "${PYPTO_V41_PREPACKED_WEIGHTS:-}" ]; then
            printf -v sidecar '%q' "$PYPTO_V41_PREPACKED_WEIGHTS"
            run_cmd="$run_cmd PYPTO_V41_PREPACKED_WEIGHTS=$sidecar"
          fi
          run_cmd="$run_cmd python -m pytest 'tests/test_deepseek_v41_serving.py::test_v41_dp4_http_answer[k5]' -q -s"
          task-submit --device auto --device-num 4 \
            --timeout 4500 --max-time 4500 --run "$run_cmd"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: dist-checkout

