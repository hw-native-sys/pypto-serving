#
# MkDocs configuration for the PyPTO Serving documentation site.
#
# The markdown under `docs/` is the single source of truth and must stay readable
# directly on GitHub; this file only describes how it is rendered. The built site
# is never committed -- CI publishes it to GitHub Pages (see .github/workflows/docs.yml).

INHERIT: .site-theme/docs-theme/base.yml

site_name: PyPTO Serving
site_description: Local inference serving with PyPTO kernels on Ascend NPUs
site_url: https://www.pypto.ai/pypto-serving/
repo_url: https://github.com/hw-native-sys/pypto-serving
repo_name: hw-native-sys/pypto-serving
edit_uri: edit/main/docs/
copyright: Copyright &copy; PyPTO Contributors

docs_dir: docs
site_dir: site

# Build inputs that live under docs/ but are not content.
exclude_docs: |
  _hooks/
  requirements.txt
  theme-revision.txt

# Broken internal links must fail the build, not warn. `mkdocs build --strict`
# promotes every warning to an error; these settings decide what counts as one.
validation:
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
  nav:
    omitted_files: warn
    not_found: warn

theme:
  custom_dir: .site-theme/docs-theme/overrides
  language: en

# Rewrites repo-relative links that escape `docs/` (source files, examples/) into
# GitHub blob URLs at build time. The markdown keeps working relative links for
# readers browsing the repo, and the site gets links that resolve -- without which
# `--strict` fails on every such reference.
hooks:
  - docs/_hooks/repo_links.py

plugins:
  - search

extra:
  pypto_project: pypto-serving
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hw-native-sys/pypto-serving
      name: PyPTO Serving on GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - User Guide:
      - Getting Started:
          - Installation: get-started/installation.md
          - Quickstart: get-started/quickstart.md
      - Inference and Serving:
          - Offline Inference: user-guide/offline-inference.md
          - Online Serving: user-guide/online-serving.md
          - Parallelism and Scaling: user-guide/parallel.md
          - Benchmarking: user-guide/benchmarking.md
          - Profiling: user-guide/profile.md
      - Models:
          - Model Support Matrix: user-guide/model-support.md
          - Qwen3-14B: user-guide/qwen.md
          - DeepSeek V4: user-guide/deepseek-v4.md
  - CLI Reference:
      - Overview: cli-reference/index.md
      - pypto-serving: cli-reference/pypto-serving.md
      - DeepSeek V4 Conversion: cli-reference/deepseek-v4-conversion.md
      - pypto-prepack-deepseek-v4: cli-reference/pypto-prepack-deepseek-v4.md
      - Environment Variables: cli-reference/env-vars.md
  - Developer Guide:
      - Overview: developer-guide/index.md
      - Serving Internals:
          - Architecture: developer-guide/architecture.md
          - Weight Staging: developer-guide/weight-staging.md
      - Model Integration:
          - Overview: developer-guide/model-integration/index.md
          - Family Detection and Model Loading: developer-guide/model-integration/family-detection.md
          - Weight Spec Rules: developer-guide/model-integration/weight-spec.md
          - Executor and Runner: developer-guide/model-integration/executor-runner.md
          - Testing: developer-guide/model-integration/testing.md
      - Model Runtime Notes:
          - DeepSeek V4 Runtime: developer-guide/deepseek-v4-runtime.md
          - DeepSeek V4 DSpark: developer-guide/deepseek-v4-dspark.md
